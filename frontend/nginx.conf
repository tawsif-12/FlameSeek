server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

  # Vite fingerprints these files, so they are safe to cache permanently.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Cesium workers and stable media are large but not fingerprinted.
  location ~* ^/(cesium|textures|satellites|site-data)/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, stale-while-revalidate=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
