server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API routing in production; keep snapshot and API paths intact.
  location ~ ^/(api(?:/|$)|meta(?:/|$)|fires(?:/|$)|events/|detections(?:/|$)|grid/|health$) {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

  # Vite fingerprints these files, so they are safe to cache permanently.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Cesium workers and stable media are large but not fingerprinted.
  location ~* ^/(cesium|textures|satellites|site-data)/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, stale-while-revalidate=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
