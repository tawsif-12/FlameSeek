services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: backend/.env
    environment:
      FLAMESEEK_PIPELINE_PYTHON: /usr/local/bin/python
    init: true
    volumes:
      - ./data:/app/data
      - ./dataset:/app/dataset:ro
      - ./outputs:/app/outputs
      - ./backend/cache:/app/backend/cache
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

